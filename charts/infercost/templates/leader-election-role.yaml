{{- if and .Values.rbac.create .Values.controllerManager.leaderElection.enabled }}
# Leader election needs leases (and configmaps/events) in the release namespace.
# Mirrors config/rbac/leader_election_role.yaml; only rendered when leader
# election is enabled so single-replica installs that turn it off need no lease RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "infercost.fullname" . }}-leader-election-role
  namespace: {{ include "infercost.namespace" . }}
  labels:
    {{- include "infercost.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "infercost.fullname" . }}-leader-election-rolebinding
  namespace: {{ include "infercost.namespace" . }}
  labels:
    {{- include "infercost.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "infercost.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "infercost.serviceAccountName" . }}
  namespace: {{ include "infercost.namespace" . }}
{{- end }}
